name: Offline reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-public.lock
      - name: Install the publication environment
        run: python -m pip install -r requirements-public.lock
      - name: Verify documentation links
        run: python -m tools.check_publication
      - name: Run the credential-free demo
        run: python -m tools.reproduce demo
      - name: Reproduce locked results without rewriting them
        run: python -m tools.reproduce verify
      - name: Fetch only the pinned tokenizer
        run: python -m tools.prepare_resources
      - name: Run all scientific and publication tests offline
        run: python -m tools.reproduce test
